<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnPath</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container mt-5">
        <!-- Header -->
        <header class="text-center mb-4">
            <h1 class="display-4">LearnPath</h1>
            <p class="lead">Create your personalized learning roadmap and discover relevant resources!</p>
        </header>

        <!-- Input Section -->
        <div class="input-group mb-3">
            <input type="text" id="topicInput" class="form-control" placeholder="Enter a topic (e.g., Machine Learning)">
            <button id="generateButton" class="btn btn-primary">Generate Roadmap</button>
        </div>

        <!-- Roadmap Section -->
        <div id="roadmapSection" class="mt-4" style="display:none;">
            <h3>Generated Roadmap</h3>
            <ul id="roadmapList" class="list-group"></ul>
        </div>

        <!-- YouTube Section -->
        <div id="youtubeSection" class="mt-4" style="display:none;">
            <h3>Related YouTube Videos</h3>
            <ul id="videoList" class="list-group"></ul>
        </div>

        <!-- Footer -->
        <footer class="text-center mt-5">
            <p>Created by <b>Us</b> © 2024</p>
        </footer>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
